name: DuoView Build118 Stock DIBR Frozen-Depth Probe
run-name: UEVR Quad Views Mono exact SDK (${{ github.run_number }})
on:
  push:
    branches:
      - experiment/duoview-depth-offline-proof-20261023
      - experiment/depthproof118-stock-dibr-20261025
      - feature/v182-fovea-glamayre-fused
      - fix/duoview-v1861-foreground-mpc-minimal-20261022
      - experiment/duoview-v1861-mpc-hud-mono-convergence-20261022
      - experiment/duoview-mono-eye-alignment-hud-v48-20261022
      - fix/duoview-v49-openxr-alignment-persistence-20261022
  pull_request:
    branches:
      - build-182
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: duoview-stage234-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  duoview-native-fix-mono-output:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: joeyhodge/UEVR
          ref: 5ac7edc207866569334175e4ed8a7517971547f6
          fetch-depth: 0
          path: backend
          persist-credentials: false
      - name: Require the SDK source credential
        shell: pwsh
        env:
          SDK_SOURCE_TOKEN: ${{ secrets.UEVR_SOURCE_TOKEN || secrets.PAT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SDK_SOURCE_TOKEN)) {
            throw 'Add the repository Actions secret UEVR_SOURCE_TOKEN using a token from your Epic-authorized GitHub account; the default repository token cannot access this SDK.'
          }
          'Configured SDK source credential detected; access will be checked against the exact original repository.'
      - name: Check out the original restricted SDK at the exact gitlink
        uses: actions/checkout@v4
        with:
          repository: joeyhodge/UESDK
          ref: 3cffbc82429b6165ceec2714f0f0d9ae48f55596
          token: ${{ secrets.UEVR_SOURCE_TOKEN || secrets.PAT_TOKEN }}
          path: backend/dependencies/submodules/UESDK
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: joeyhodge/uevr-frontend
          ref: 60be4b0f9a646109fd9fdf448bacd41477234091
          path: frontend
          persist-credentials: false
      - name: Verify the unchanged exact source and public dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory evidence -Force | Out-Null
          git -C backend submodule update --init --depth 1 -- dependencies/submodules/glm dependencies/submodules/imgui dependencies/submodules/spdlog
          if ($LASTEXITCODE -ne 0) { throw 'Pinned public submodule checkout failed' }
          python workspace/duoview/clean_restart/verify_exact_baseline.py workspace/duoview/clean_restart/baseline.lock.json backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Exact source identity or completeness verification failed' }
      - name: Apply exact-anchor Stage 1 fallback patch
        shell: pwsh
        run: |
          python workspace/duoview/joey_stage1/apply_stage1.py backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Failed to apply guarded DuoView Stage 1 edits' }
          python workspace/duoview/joey_stage1/verify_stage1.py backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected source changes in DuoView Stage 1' }
      - name: Apply Native Stereo Fix backed DuoView source changes
        shell: pwsh
        run: |
          python workspace/duoview/joey_stage1/apply_stage234.py backend frontend workspace/duoview
          if ($LASTEXITCODE -ne 0) { throw 'Stage 2-4 source anchors did not match original Joey' }
          python workspace/duoview/joey_stage1/apply_foreground_mpc_minimal.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Minimal STALKER 2 foreground MPC patch failed' }
          python workspace/duoview/joey_stage1/apply_mono_hud_convergence.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Opt-in single-quad Mono HUD convergence patch failed' }
          python workspace/duoview/joey_stage1/apply_mono_alignment_build48.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Build48 Mono optical presentation alignment / HUD repair failed' }
          python workspace/duoview/joey_stage1/apply_runtime_eye_alignment_persistence_build49.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Build49 Mono eye alignment reset persistence patch failed' }
          python workspace/duoview/joey_stage1/test_runtime_eye_alignment_persistence_build49.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Build49 Mono eye alignment persistence regression failed' }
          python workspace/duoview/depth_proof/test_depth_proof_patch.py backend --record evidence/protected-renderer-hashes.json
          if ($LASTEXITCODE -ne 0) { throw 'Protected renderer hash recording failed' }
          python workspace/duoview/depth_proof/apply_depth_proof.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Independent depth proof patch failed' }
          python workspace/duoview/depth_proof/test_depth_proof_patch.py backend --compare evidence/protected-renderer-hashes.json
          if ($LASTEXITCODE -ne 0) { throw 'Depth proof altered protected rendering source' }
      - name: Wire completed GPU depth into Joey stock DIBR after DuoView Mono
        shell: pwsh
        run: |
          python workspace/duoview/depth_proof/apply_stock_dibr_proof.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Build118 stock DIBR patch failed; do not package' }
          python workspace/duoview/joey_stage1/verify_stage234.py backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Stage 2-4 violated original-source or SDK boundaries' }
      - name: Verify real D3D12 depth readback and rejection paths on WARP
        shell: pwsh
        run: |
          cmake -S workspace/duoview/depth_proof -B depth_proof_tests -G 'Visual Studio 17 2022' -A x64 *> evidence/depth-proof-config.log
          if ($LASTEXITCODE -ne 0) { Get-Content evidence/depth-proof-config.log; throw 'Depth proof configure failed' }
          cmake --build depth_proof_tests --config Release --parallel 2 *> evidence/depth-proof-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content evidence/depth-proof-build.log; throw 'Depth proof compile failed' }
          ctest --test-dir depth_proof_tests -C Release --output-on-failure --no-tests=error *> evidence/depth-proof-test.log
          Get-Content evidence/depth-proof-test.log
          if ($LASTEXITCODE -ne 0) { throw 'Depth proof GPU/readback tests failed' }
          Copy-Item depth_proof_tests/proof-output evidence/depth-proof-output -Recurse -ErrorAction SilentlyContinue
      - name: Verify pinned production geometry and pair-state contracts
        shell: pwsh
        run: |
          cmake -S workspace/duoview/joey_stage1 -B duo_pinned_tests -G 'Visual Studio 17 2022' -A x64 "-DJOYEY_BACKEND_DIR=$((Resolve-Path backend).Path)" *> evidence/pinned-config.log
          $code=$LASTEXITCODE; Get-Content evidence/pinned-config.log | Select-Object -Last 40
          if ($code -ne 0) { throw "Pinned production test configuration failed ($code)" }
          cmake --build duo_pinned_tests --config Release --parallel 2 *> evidence/pinned-build.log
          $code=$LASTEXITCODE; Get-Content evidence/pinned-build.log | Select-Object -Last 80
          if ($code -ne 0) { throw "Pinned production tests failed compilation ($code)" }
          ctest --test-dir duo_pinned_tests -C Release --output-on-failure --no-tests=error *> evidence/pinned-results.log
          $code=$LASTEXITCODE; Get-Content evidence/pinned-results.log
          if ($code -ne 0) { throw "Pinned production contract failed ($code)" }
      - name: Configure independent DuoView geometric, state, and GPU WARP tests
        shell: pwsh
        run: |
          cmake -S workspace/duoview -B duo_tests -G 'Visual Studio 17 2022' -A x64 *> evidence/duo-configure.log
          $code=$LASTEXITCODE; Get-Content evidence/duo-configure.log | Select-Object -Last 50
          if ($code -ne 0) { throw "DuoView independent tests configuration failed ($code)" }
          cmake --build duo_tests --config Release --parallel 2 *> evidence/duo-test-build.log
          $code=$LASTEXITCODE; Get-Content evidence/duo-test-build.log | Select-Object -Last 100
          if ($code -ne 0) { throw "DuoView independent tests failed compilation ($code)" }
          ctest --test-dir duo_tests -C Release --output-on-failure --no-tests=error *> evidence/duo-test-results.log
          $code=$LASTEXITCODE; Get-Content evidence/duo-test-results.log
          if ($code -ne 0) { throw "DuoView independent CPU/GPU tests failed ($code)" }
      - name: Configure original compatibility tests and production backend
        shell: pwsh
        run: |
          cmake -S backend -B backend/build -G 'Visual Studio 17 2022' -A x64 -DCMAKE_BUILD_TYPE=Release -DUEVR_BUILD_COMPATIBILITY_TESTS=ON *> evidence/configure.log
          $code=$LASTEXITCODE; Get-Content evidence/configure.log | Select-Object -Last 60
          if ($code -ne 0) { throw "Original Joey configuration failed ($code)" }
      - name: Build original backend and auxiliary DLLs
        shell: pwsh
        run: |
          cmake --build backend/build --config Release --target uevr vr-plugin-nullifier LuaVR --parallel 2 *> evidence/backend-build.log
          $code=$LASTEXITCODE; Get-Content evidence/backend-build.log | Select-Object -Last 100
          if ($code -ne 0) { throw "Original latest Joey backend failed to compile ($code)" }
      - name: Build every test target used by the official matching build
        shell: pwsh
        run: |
          cmake --build backend/build --config Release --parallel 2 --target compatibility-policy-tests steam-frame-input-tests stock-frame-migration-tests gamepad-recovery-tests kananlib-decode-window-tests diagnostic-safety-tests prospi-camera-trace-tests prospi-camera-framing-tests prospi-celebration-framing-tests prospi-roof-visibility-tests hifi-hook-memory-tests nascar-hook-compatibility-tests input-hook-installation-tests mono-d3d11-tests mono-d3d12-tests ui-alpha-tests ui-alpha-lifecycle-tests ui-composition-tests lua-fname-binding-tests lua-context-dispatch-tests lua-controller-input-tests stalker2-native-policy-tests stalker2-native-d3d12-tests *> evidence/test-build.log
          $code=$LASTEXITCODE; Get-Content evidence/test-build.log | Select-Object -Last 100
          if ($code -ne 0) { throw "Original compatibility tests failed to compile ($code)" }
      - name: Run the complete original compatibility suite
        shell: pwsh
        run: |
          ctest --test-dir backend/build -C Release --output-on-failure --no-tests=error *> evidence/compatibility-tests.log
          $code=$LASTEXITCODE; Get-Content evidence/compatibility-tests.log
          if ($code -ne 0) { throw "Original compatibility tests failed ($code)" }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Test and build matching original frontend
        shell: pwsh
        run: |
          dotnet run --project frontend/tests/RenderingModes --configuration Release *> evidence/frontend-tests.log
          $code=$LASTEXITCODE; Get-Content evidence/frontend-tests.log
          if ($code -ne 0) { throw 'Original rendering-ID tests failed' }
          dotnet publish frontend/UEVR/UEVR.csproj --output package --configuration Release *> evidence/frontend-build.log
          $code=$LASTEXITCODE; Get-Content evidence/frontend-build.log | Select-Object -Last 60
          if ($code -ne 0) { throw 'Matching original frontend failed to compile' }
      - name: Verify final Stage 2-4 code identity and package
        shell: pwsh
        run: |
          python workspace/duoview/joey_stage1/verify_stage234.py backend frontend evidence --final
          if ($LASTEXITCODE -ne 0) { throw 'DuoView Stage 2-4 source changed during the build' }
          Copy-Item backend/build/bin/uevr/*.dll package/
          Copy-Item backend/build/bin/vr-plugin-nullifier/UEVRPluginNullifier.dll package/
          Copy-Item backend/build/bin/LuaVR/LuaVR.dll package/
          Copy-Item workspace/duoview/depth_proof/README.md package/DEPTH_PROOF_README.md
          Copy-Item workspace/duoview/depth_proof/TAKEOVER_REVIEW.md package/DEPTH_PROOF_REVIEW.md
          Copy-Item workspace/duoview/clean_restart/baseline.lock.json package/
          Copy-Item evidence/exact-baseline-source.json package/
          Copy-Item evidence/duoview-stage1-edits.json package/
          Copy-Item evidence/duoview-stage1-source-hashes.json package/
          Copy-Item evidence/duoview-stage234-hashes.json package/
          @'
          DUOVIEW OFFLINE DEPTH PROOF — EXPERIMENTAL, GAME UNVERIFIED
          Stable baseline: v186.1 Build49 / 60d0aae86949723d21266e4121a833f0191729c2.
          Preserve your stable installation. Extract into a SEPARATE TEST DIRECTORY.
          Source renderers, compositor, gaze, HUD/eye alignment, and shaders are unchanged.
          Experimental frozen-depth stereo using Joey stock DIBRPreview.
          After capture, select a completed candidate 1/4/5/6/9, then Test Joey DIBR.
          This is NOT live stereo. Depth freezes; no RGB-D synchronization or comfort proof.
          Prior P1/S0 depth preview source and Build123 code are absent.
          Test: activate DuoView ID6, open DuoView Mono quality -> Depth proof to disk.
          Click Capture depth proof (10 seconds, once per game). Remain in a loaded scene.
          After about 10 seconds plus export, read the explicit Saved / NO DEPTH IMAGE / FAILED status.
          Capture callbacks are bounded; a slow frame can delay final status/export.
          Output beside the UEVR log: %APPDATA%/UnrealVRMod/<game>/depth_proof/<timestamp>/
          Open preview.html to inspect candidate_N.bmp previews. Also candidate_N.pgm
          and candidate_N.f32 raw float32 Z,
          manifest.json transition/rejection/submission metadata, image_results.json.
          Zip the COMPLETE timestamp folder and fresh UEVR log, including failures.
          Use Test Joey DIBR or STOP stock DIBR test / MONO in the depth-proof menu.
          Normal DuoView Mono remains default and is never replaced unless explicitly selected.
          Each capture is anonymous: roles, scene identity, RGB correspondence, frame/pose
          matching and metric depth remain unverified. First inspect geometry in the files.
          GPU completion is based on the EXACT recorded command-list submission queue.
          Plane 0 only; reject unknown recording, active/suspended passes, split barriers,
          ambiguous batches and unsupported state windows. Do not broaden without evidence.
          One session per game process. Up to 128MiB of readback memory retained until exit,
          including timeout/reset, to avoid releasing references still used by the GPU.
          Diagnostic discovery and one-time allocations may add temporary overhead.
          Windows WARP tests check known depth values/readbacks. Green CI does NOT establish
          STALKER 2 depth acquisition or headset behavior. No stable-release claim.
          Ordinary Build49 behavior: warmup keeps the XR transition loop live.
          '@ | Set-Content package/READ_FIRST.txt
          $needed=@('UEVRBackend.dll','UEVRPluginNullifier.dll','LuaVR.dll','READ_FIRST.txt','duoview-stage234-hashes.json','exact-baseline-source.json')
          foreach ($name in $needed) { if (!(Test-Path ("package/" + $name))) { throw "Missing critical package file: $name" } }
          if (@(Get-ChildItem package -File -Filter *.exe).Count -lt 1) { throw "Missing Joey frontend executable" }
          if ((Get-Content package/READ_FIRST.txt -Raw) -notmatch 'warmup keeps the XR transition loop live') { throw 'Stale Native Fix warmup instructions' }
          Get-ChildItem package -Recurse -File | Get-FileHash -Algorithm SHA256 | ConvertTo-Json | Set-Content evidence/package-sha256.json
          $zip="UEVR-DuoView-StockDIBR-Proof118-${{ github.run_number }}.zip"
          Compress-Archive -Path package/* -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash | Set-Content "$zip.sha256"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: UEVR-DuoView-StockDIBR-Proof118-${{ github.run_number }}
          path: |
            UEVR-DuoView-StockDIBR-Proof118-*.zip
            UEVR-DuoView-StockDIBR-Proof118-*.zip.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Record public source and dependency provenance
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory evidence -Force | Out-Null
          git -C backend submodule status | Set-Content evidence/submodules.txt
          Copy-Item workspace/duoview/clean_restart/baseline.lock.json evidence/
          Copy-Item backend/build/Testing/Temporary/LastTest.log evidence/ -ErrorAction SilentlyContinue
          $global:LASTEXITCODE=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UEVR-v186.1-MPC-HUD-EyeAlignment-Persist49-Evidence-${{ github.run_number }}
          path: evidence/
          if-no-files-found: error

