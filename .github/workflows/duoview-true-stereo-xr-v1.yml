          Add-Content package/READ_FIRST.txt 'CI49 NGX-SR DEPTH EXPERIMENT: Enable ONLY by setting environment variable UEVR_DUOVIEW_NGX_DEPTH=1 in STALKER2 process BEFORE UEVR inject. Enable R5 and DuoView ID6, split-eye on, Stereo mode 4 then 5. NGX output extents must identify TWO distinct fresh roles; otherwise fallback to Build48 DSV depth selector. Mode0 and all builds without env var remain Build48. Depth state/eye/fov and headset comfort unverified. Do NOT co-inject Cheeky/OFXR until hook compatibility tested.'
          Add-Content package/READ_FIRST.txt 'Build48 experimental depth stability; manual LEFT/RIGHT pins and backups, Auto stickiness, capture diagnostics. No DLSS-input hook. Depth-producer frame/eye attribution unverified. Keep Build45 as rollback. Peripheral scale 0.5, modes 0->4->5.'
          @{
            schema_version=1; source_commit=$env:GITHUB_SHA;
            source_repository='liviutrn/UEVR-Quad-Views-Mono';
            workflow_run_id=$env:GITHUB_RUN_ID; workflow_run_number=$env:GITHUB_RUN_NUMBER;
