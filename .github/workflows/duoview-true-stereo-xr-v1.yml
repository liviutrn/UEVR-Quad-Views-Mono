name: DuoView CI49 - NGX DLSS depth experimental Windows build
run-name: DuoView CI49 NGX - Windows full build (#${{ github.run_number }})
on:
  push:
    branches:
      - experiment/duoview-165-true-stereo-xr-v1-reviewed-20261028
      - review/true-stereo-xr-audit-fixes-20261028
      - review/duoview-depth-contracts-20261028
      - experiment/ci31-provenance-audit-20261028
      - experiment/ci32-stereo-reconstruction-20261028
      - experiment/ci33-surface-stereo-20261028
      - experiment/ci48-stability-pre-dlss-20261029
      - experiment/ci49-ngx-dlss-depth-20261029
    paths:
      - ci48/payload.b64
      - ci49/payload.b64
  pull_request:
    branches:
      - build-182
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: duoview-stage234-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  live-shader-preflight:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace
          persist-credentials: false
      - name: Compile every live compositor and surface entry point with Windows FXC
        shell: pwsh
        run: |
          python workspace/duoview/embed_shader.py "$env:RUNNER_TEMP/DuoViewShaderSource.hpp"
          if ($LASTEXITCODE -ne 0) { throw 'Live shader preflight failed' }
  duoview-native-fix-mono-output:
    needs: live-shader-preflight
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: joeyhodge/UEVR
          ref: 5ac7edc207866569334175e4ed8a7517971547f6
          fetch-depth: 0
          path: backend
          persist-credentials: false
      - name: Require the SDK source credential
        shell: pwsh
        env:
          SDK_SOURCE_TOKEN: ${{ secrets.UEVR_SOURCE_TOKEN || secrets.PAT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SDK_SOURCE_TOKEN)) {
            throw 'Add the repository Actions secret UEVR_SOURCE_TOKEN using a token from your Epic-authorized GitHub account; the default repository token cannot access this SDK.'
          }
          'Configured SDK source credential detected; access will be checked against the exact original repository.'
      - name: Check out the original restricted SDK at the exact gitlink
        uses: actions/checkout@v4
        with:
          repository: joeyhodge/UESDK
          ref: 3cffbc82429b6165ceec2714f0f0d9ae48f55596
          token: ${{ secrets.UEVR_SOURCE_TOKEN || secrets.PAT_TOKEN }}
          path: backend/dependencies/submodules/UESDK
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: joeyhodge/uevr-frontend
          ref: 60be4b0f9a646109fd9fdf448bacd41477234091
          path: frontend
          persist-credentials: false
      - name: Verify the unchanged exact source and public dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory evidence -Force | Out-Null
          git -C backend submodule update --init --depth 1 -- dependencies/submodules/glm dependencies/submodules/imgui dependencies/submodules/spdlog
          if ($LASTEXITCODE -ne 0) { throw 'Pinned public submodule checkout failed' }
          python workspace/duoview/clean_restart/verify_exact_baseline.py workspace/duoview/clean_restart/baseline.lock.json backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Exact source identity or completeness verification failed' }
      - name: Apply exact-anchor Stage 1 fallback patch
        shell: pwsh
        run: |
          python workspace/duoview/joey_stage1/apply_stage1.py backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Failed to apply guarded DuoView Stage 1 edits' }
          python workspace/duoview/joey_stage1/verify_stage1.py backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected source changes in DuoView Stage 1' }
      - name: Apply Native Stereo Fix backed DuoView source changes
        shell: pwsh
        run: |
          python workspace/duoview/joey_stage1/apply_stage234.py backend frontend workspace/duoview
          if ($LASTEXITCODE -ne 0) { throw 'Stage 2-4 source anchors did not match original Joey' }
          python workspace/duoview/joey_stage1/apply_foreground_mpc_minimal.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Minimal STALKER 2 foreground MPC patch failed' }
          python workspace/duoview/joey_stage1/apply_mono_hud_convergence.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Opt-in single-quad Mono HUD convergence patch failed' }
          python workspace/duoview/joey_stage1/apply_mono_alignment_build48.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Build48 Mono optical presentation alignment / HUD repair failed' }
          python workspace/duoview/joey_stage1/apply_runtime_eye_alignment_persistence_build49.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Build49 Mono eye alignment reset persistence patch failed' }
          python workspace/duoview/joey_stage1/test_runtime_eye_alignment_persistence_build49.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Build49 Mono eye alignment persistence regression failed' }
          python workspace/duoview/joey_stage1/apply_xyz_head_scaling.py backend
          if ($LASTEXITCODE -ne 0) { throw 'XYZ head scaling patch failed to match pinned release source' }
          python workspace/duoview/joey_stage1/test_xyz_head_scaling.py backend
          if ($LASTEXITCODE -ne 0) { throw 'XYZ head scaling settings/keybind/pose contract failed' }
          python workspace/duoview/joey_stage1/apply_native_split_eye_165.py backend
          if ($LASTEXITCODE -ne 0) { throw 'V3 validated per-eye camera/projection patch failed' }
          python workspace/duoview/joey_stage1/test_native_split_eye_165.py backend
          if ($LASTEXITCODE -ne 0) { throw 'V3 per-eye production contracts failed' }
          git -C backend diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Split-eye source patch failed diff check' }
          python workspace/duoview/joey_stage1/verify_stage234.py backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Stage 2-4 violated original-source or SDK boundaries' }
      - name: Apply proven R5 DIBR capture/hooks after frozen DuoView sources
        shell: pwsh
        run: |
          python workspace/stock_dibr/apply.py backend
          if ($LASTEXITCODE -ne 0) { throw 'R5 base patch incompatible with DuoView' }
          python workspace/stock_dibr/apply_provenance.py backend
          if ($LASTEXITCODE -ne 0) { throw 'R5 DSV provenance patch failed' }
          python workspace/stock_dibr/apply_runtime_fix.py backend
          if ($LASTEXITCODE -ne 0) { throw 'R5 runtime patch failed' }
          python workspace/stock_dibr/apply_queue_fix.py backend
          if ($LASTEXITCODE -ne 0) { throw 'R5 live queue hook failed' }
          python workspace/stock_dibr/apply_review_fix.py backend
          if ($LASTEXITCODE -ne 0) { throw 'R5 reprojection/lifecycle review patch failed' }
          python workspace/stock_dibr/apply_transaction_fix.py backend
          if ($LASTEXITCODE -ne 0) { throw 'R5 transactional resource fence patch failed' }
          python workspace/stock_dibr/apply_adversarial_hooks.py backend
          if ($LASTEXITCODE -ne 0) { throw 'R5 observer lifecycle patch failed' }
          python workspace/stock_dibr/apply_ui_retirement_fix.py backend
          if ($LASTEXITCODE -ne 0) { throw 'R5 UI retirement patch failed' }
          python workspace/duoview/stereo/integrate_r5_v1.py backend
          if ($LASTEXITCODE -ne 0) { throw 'DuoView R5 guarded integration hook failed' }
          python workspace/duoview/stereo/enhance_depth_bridge_v1.py backend
          if ($LASTEXITCODE -ne 0) { throw 'DepthBridge provenance enhancement rejected' }
          python workspace/duoview/stereo/test_depth_bridge_v1.py backend
          if ($LASTEXITCODE -ne 0) { throw 'V3+R5 metadata-only diagnostics regression failed' }
          python workspace/duoview/stereo/add_manual_capture.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Manual on-demand snapshot patch failed' }
          python workspace/duoview/stereo/test_manual_capture.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Depth/color snapshot integration contract failed' }
          python workspace/duoview/stereo/attach_depth_probe.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Depth browser source integration failed' }
          python workspace/duoview/stereo/test_depth_probe.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Depth candidate browser source contract failed' }
          python workspace/duoview/stereo/enable_true_stereo_xr.py backend
          if ($LASTEXITCODE -ne 0) { throw 'TRUE STEREO OpenXR integration patch failed' }
          python workspace/duoview/stereo/test_true_stereo_xr.py backend
          python workspace/duoview/stereo/apply_gameplay_guards.py backend
          if ($LASTEXITCODE -ne 0) { throw 'CI30 gameplay guard patch failed' }
          python workspace/duoview/stereo/test_gameplay_guards.py backend
          if ($LASTEXITCODE -ne 0) { throw 'CI30 gameplay guard contract failed' }
          python workspace/duoview/stereo/provenance_v1/apply_provenance_audit.py backend
          if ($LASTEXITCODE -ne 0) { throw 'CI31 producer shape diagnostic patch failed' }
          python workspace/duoview/stereo/provenance_v1/test_provenance_audit.py backend
          if ($LASTEXITCODE -ne 0) { throw 'CI31 diagnostic integration test failed' }
          python workspace/duoview/stereo/provenance_v1/test_fovea_isolation.py backend
          if ($LASTEXITCODE -ne 0) { throw 'CI31 mode-3 fovea-only shader regression failed' }
          if ($LASTEXITCODE -ne 0) { throw 'TRUE STEREO resource + eye-output contract rejected' }
          git -C backend diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Backend whitespace/patch conflict' }
      - name: Configure MSVC for R5 command-line WARP fixtures
        uses: ilammy/msvc-dev-cmd@v1
      - name: Reproduce unread-depth overwrite on the actual previous capture implementation
        shell: pwsh
        run: |
          cl /nologo /std:c++20 /EHsc /W4 /Ibackend/src workspace/stock_dibr/capture_retention_warp.cpp /Fe:capture-retention-before.exe /link d3d12.lib dxgi.lib
          if ($LASTEXITCODE -ne 0) { throw 'Capture retention reproduction failed compilation' }
          ./capture-retention-before.exe --expect-overwrite *> evidence/capture-retention-before.log
          $code=$LASTEXITCODE; Get-Content evidence/capture-retention-before.log
          if ($code -ne 0) { throw 'Expected old same-interval overwrite did not reproduce' }
      - name: Fix capture ownership and verify separately completed GPU submissions
        shell: pwsh
        run: |
          python workspace/duoview/stereo/provenance_v1/apply_capture_retention.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Capture retention patch anchors changed' }
          cl /nologo /std:c++20 /EHsc /W4 /WX workspace/stock_dibr/capture_slot_policy_tests.cpp /Fe:capture-slot-policy.exe
          if ($LASTEXITCODE -ne 0) { throw 'Capture slot policy failed compilation' }
          ./capture-slot-policy.exe
          if ($LASTEXITCODE -ne 0) { throw 'Capture slot policy regression failed' }
          cl /nologo /std:c++20 /EHsc /W4 /Ibackend/src workspace/stock_dibr/capture_retention_warp.cpp /Fe:capture-retention-after.exe /link d3d12.lib dxgi.lib
          if ($LASTEXITCODE -ne 0) { throw 'Corrected capture retention WARP failed compilation' }
          ./capture-retention-after.exe *> evidence/capture-retention-after.log
          $code=$LASTEXITCODE; Get-Content evidence/capture-retention-after.log
          if ($code -ne 0) { throw 'Completed producer copy was lost before consumer retirement' }
      - name: Connect and validate source-depth surface reconstruction
        shell: pwsh
        run: |
          python workspace/duoview/stereo/apply_surface_renderer.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Surface renderer live XR integration failed' }
          cl /nologo /std:c++20 /EHsc /W4 /WX workspace/duoview/stereo/surface_geometry_tests.cpp /Fe:surface-geometry.exe
          if ($LASTEXITCODE -ne 0) { throw 'Surface geometry tests failed compilation' }
          ./surface-geometry.exe
          if ($LASTEXITCODE -ne 0) { throw 'Surface camera-relative geometry failed' }
          git -C backend diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Surface integration source whitespace conflict' }
      - name: Install exact Build48 patch and run policy regressions
        shell: pwsh
        run: |
          @'
          import base64,io,lzma,tarfile,pathlib
          root=pathlib.Path('workspace').resolve()
          src=root/'ci48/payload.b64'
          if not src.is_file(): raise RuntimeError('Upload the provided ci48/payload.b64 first')
          blob=lzma.decompress(base64.b64decode(src.read_text(encoding='ascii')))
          with tarfile.open(fileobj=io.BytesIO(blob),mode='r:') as archive:
              for member in archive.getmembers():
                  p=pathlib.PurePosixPath(member.name)
                  if not member.isfile() or not p.parts or p.parts[0]!='ci48' or '..' in p.parts:
                      raise RuntimeError('Invalid Build48 payload path')
                  dest=root.joinpath(*p.parts);dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(archive.extractfile(member).read())
          print('Build48 source payload unpacked')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Build48 unpack failed' }
          @'
          import hashlib,json,pathlib
          root=pathlib.Path("backend")
          contract=json.loads(pathlib.Path("workspace/ci48/hashes.json").read_text(encoding="utf-8"))
          for relative,identity in contract.items():
              expected=identity["old_sha256"]
              file=root/relative
              if expected is None or not file.is_file():
                  continue
              raw=file.read_bytes()
              if hashlib.sha256(raw).hexdigest()==expected:
                  continue
              normalized=raw.replace(b"\r\n",b"\n")
              if normalized!=raw and hashlib.sha256(normalized).hexdigest()==expected:
                  file.write_bytes(normalized)
                  print("Build48 verified CRLF normalization:",relative)
              else:
                  raise RuntimeError("Build48 source changed, not a line-ending-only difference: "+relative)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Build48 exact baseline / line-ending verification failed' }
          python workspace/ci48/apply.py backend *> evidence/build48-source-guard.log
          $initial_code=$LASTEXITCODE; Get-Content evidence/build48-source-guard.log
          @'
          import hashlib,json,pathlib
          root=pathlib.Path("backend")
          contract=json.loads(pathlib.Path("workspace/ci48/hashes.json").read_text(encoding="utf-8"))
          for relative,identity in contract.items():
              file=root/relative
              if not file.is_file():
                  raise RuntimeError("Build48 missing post-patch production file: "+relative)
              expected=identity["new_sha256"]
              raw=file.read_bytes()
              if hashlib.sha256(raw).hexdigest()==expected:
                  continue
              normalized=raw.replace(b"\r\n",b"\n")
              if normalized!=raw and hashlib.sha256(normalized).hexdigest()==expected:
                  file.write_bytes(normalized)
                  print("Build48 verified post-patch CRLF normalization:",relative)
              else:
                  raise RuntimeError("Build48 post-patch source differs beyond line endings: "+relative+" raw="+hashlib.sha256(raw).hexdigest()+" lf="+hashlib.sha256(normalized).hexdigest())
          print("PASS: all ten Build48 production files match the exact hash contract")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Build48 exact post-patch verification failed' }
          if ($initial_code -ne 0) { Write-Host 'Original verifier reported a Windows-only post-patch line-ending difference; canonical output independently verified and normalized' }
          python workspace/ci48/windows_macro_compat.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Build48 exact MSVC macro compatibility correction failed' }
          @'
          import hashlib,pathlib,re
          expected={
           "src/mods/vr/d3d12/StockDibrDepth.hpp":("686589b4db6292854334f8ad560e9e56786358aba2ddda7514e0ba33b1990304","05518e186645fa2a6a55dcf0767afff5b33534da0c58d463b5ff64a586f6f8d6"),
           "src/mods/vr/D3D12Component.hpp":("922192a285c6c51595e58a4decc06aece24e0d38a26439919311472931f19ccb","83fe03ed7bcf26dfad6c8f4464ee884a2317b8760467d8614036cbe5dcad8164")
          }
          for relative,(before,after) in expected.items():
              file=pathlib.Path("backend")/relative
              raw=file.read_bytes()
              if hashlib.sha256(raw).hexdigest()!=before:
                  raise RuntimeError("Build48 namespace source hash did not match approved input: "+relative)
              revised=re.sub(rb"(?<!:)duoview::depthpin::",b"::duoview::depthpin::",raw)
              if revised==raw or hashlib.sha256(revised).hexdigest()!=after:
                  raise RuntimeError("Build48 explicit global namespace patch output mismatch: "+relative)
              file.write_bytes(revised)
              print("Build48 explicit namespace qualifier verified",relative)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Build48 namespace collision fix did not satisfy source identity contract' }
          foreach ($t in @('adversarial48_tests','auto_pair_review_tests','depth_pin_policy_tests','observed_pass_adversarial_tests')) {
            cl /nologo /std:c++20 /EHsc /W4 /WX /Ibackend/src/mods/vr/d3d12 "workspace/ci48/$t.cpp" "/Fe:$t.exe"
            if ($LASTEXITCODE -ne 0) { throw "Build48 $t compile failed" }
            & "./$t.exe" *> "evidence/$t.log"
            $code=$LASTEXITCODE; Get-Content "evidence/$t.log"
            if ($code -ne 0) { throw "Build48 $t regression failed" }
          }
          python workspace/ci48/test_capture_audit.py
          if ($LASTEXITCODE -ne 0) { throw 'Capture audit 47A failed' }
          python workspace/ci48/test_capture_audit48.py
          if ($LASTEXITCODE -ne 0) { throw 'Capture audit Build48 failed' }
          python workspace/ci48/test_integration48.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Build48 integration verification failed' }
          git -C backend diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Build48 whitespace issues' }
      - name: Apply CI49 Cheeky-inspired NGX DLSS SR depth experiment
        shell: pwsh
        run: |
          @'
          import base64,io,lzma,tarfile,pathlib
          root=pathlib.Path("workspace").resolve()
          payload=root/"ci49/payload.b64"
          blob=lzma.decompress(base64.b64decode(payload.read_text().strip()))
          with tarfile.open(fileobj=io.BytesIO(blob),mode="r:") as archive:
              for item in archive.getmembers():
                  p=pathlib.PurePosixPath(item.name)
                  if not item.isfile() or not p.parts or p.parts[0]!="ci49" or ".." in p.parts:
                      raise RuntimeError("unsafe CI49 payload path")
                  dst=root.joinpath(*p.parts);dst.parent.mkdir(parents=True,exist_ok=True)
                  dst.write_bytes(archive.extractfile(item).read())
          print("CI49 source overlay unpacked")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'CI49 source unpack rejected' }
          python workspace/ci49/apply.py backend *> evidence/ci49-ngx-source.log
          $code=$LASTEXITCODE; Get-Content evidence/ci49-ngx-source.log
          if ($code -ne 0) { throw 'CI49 source overlay hash/patch guard failed' }
          python workspace/ci49/test.py
          if ($LASTEXITCODE -ne 0) { throw 'CI49 explicit source contract failed' }
          git -C backend diff --check
          if ($LASTEXITCODE -ne 0) { throw 'CI49 source diff whitespace regression' }
      - name: Compile stereo synthesis and hybrid z-owner-forward-fuse shaders
        shell: pwsh
        run: |
          python -m unittest discover -s workspace/duoview/stereo/synthesis_v1/tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'V2 stereo geometry tests failed' }
          cl /nologo /std:c++20 /EHsc workspace/duoview/stereo/synthesis_v1/tests/ContractCompile.cpp /Fe:stereo_contract.exe
          if ($LASTEXITCODE -ne 0) { throw 'Stereo contract compile failed' }
          ./stereo_contract.exe
          if ($LASTEXITCODE -ne 0) { throw 'Stereo contract failed' }
          cl /nologo /std:c++20 /EHsc workspace/duoview/stereo/hybrid_v1/HybridContractTest.cpp /Fe:hybrid_contract.exe
          if ($LASTEXITCODE -ne 0) { throw 'Hybrid contract compile failed' }
          ./hybrid_contract.exe
          if ($LASTEXITCODE -ne 0) { throw 'Hybrid contract failed' }
          cl /nologo /std:c++20 /EHsc workspace/duoview/stereo/provenance_v1/ProducerContractTest.cpp /Fe:producer_contract.exe
          if ($LASTEXITCODE -ne 0) { throw 'CI31 producer identity contract compile failed' }
          ./producer_contract.exe
          if ($LASTEXITCODE -ne 0) { throw 'CI31 producer identity contract failed' }
          $fxc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter fxc.exe -Recurse -File |
            Where-Object { $_.FullName -like '*\x64\fxc.exe' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$fxc) { throw 'FXC not installed' }
          New-Item -ItemType Directory evidence/hybrid-shaders -Force | Out-Null
          foreach ($entry in @('CSForwardDepth','CSForwardOwner','CSForwardResolve','CSHybridFuse')) {
            & $fxc.FullName /nologo /T cs_5_0 /E $entry /Fo "evidence/hybrid-shaders/$entry.cso" workspace/duoview/stereo/hybrid_v1/HybridForwardAndFuse.hlsl
            if ($LASTEXITCODE -ne 0) { throw "Hybrid shader $entry failed" }
          }
          & $fxc.FullName /nologo /T cs_5_0 /E CSBackwardTargetDepth /Fo evidence/hybrid-shaders/CSBackwardTargetDepth.cso workspace/duoview/stereo/synthesis_v1/StereoBackwardGather.hlsl
          if ($LASTEXITCODE -ne 0) { throw 'Backward shader failed' }
      - name: Verify original R5 depth, GPU, queue and transaction fixtures
        shell: pwsh
        run: |
          python workspace/stock_dibr/run_tests.py backend r5_tests *> evidence/r5-tests.log
          $code=$LASTEXITCODE; Get-Content evidence/r5-tests.log | Select-Object -Last 100
          if ($code -ne 0) { throw "R5 WARP/policy regression ($code)" }
      - name: Verify pinned production geometry and pair-state contracts
        shell: pwsh
        run: |
          cmake -S workspace/duoview/joey_stage1 -B duo_pinned_tests -G 'Visual Studio 17 2022' -A x64 "-DJOYEY_BACKEND_DIR=$((Resolve-Path backend).Path)" *> evidence/pinned-config.log
          $code=$LASTEXITCODE; Get-Content evidence/pinned-config.log | Select-Object -Last 40
          if ($code -ne 0) { throw "Pinned production test configuration failed ($code)" }
          cmake --build duo_pinned_tests --config Release --parallel 2 *> evidence/pinned-build.log
          $code=$LASTEXITCODE; Get-Content evidence/pinned-build.log | Select-Object -Last 80
          if ($code -ne 0) { throw "Pinned production tests failed compilation ($code)" }
          ctest --test-dir duo_pinned_tests -C Release --output-on-failure --no-tests=error *> evidence/pinned-results.log
          $code=$LASTEXITCODE; Get-Content evidence/pinned-results.log
          if ($code -ne 0) { throw "Pinned production contract failed ($code)" }
      - name: Configure independent DuoView geometric, state, and GPU WARP tests
        shell: pwsh
        run: |
          cmake -S workspace/duoview -B duo_tests -G 'Visual Studio 17 2022' -A x64 *> evidence/duo-configure.log
          $code=$LASTEXITCODE; Get-Content evidence/duo-configure.log | Select-Object -Last 50
          if ($code -ne 0) { throw "DuoView independent tests configuration failed ($code)" }
          cmake --build duo_tests --config Release --parallel 2 *> evidence/duo-test-build.log
          $code=$LASTEXITCODE; Get-Content evidence/duo-test-build.log | Select-Object -Last 100
          if ($code -ne 0) { throw "DuoView independent tests failed compilation ($code)" }
          ctest --test-dir duo_tests -C Release --output-on-failure --no-tests=error *> evidence/duo-test-results.log
          $code=$LASTEXITCODE; Get-Content evidence/duo-test-results.log
          if ($code -ne 0) { throw "DuoView independent CPU/GPU tests failed ($code)" }
      - name: Configure original compatibility tests and production backend
        shell: pwsh
        run: |
          cmake -S backend -B backend/build -G 'Visual Studio 17 2022' -A x64 -DCMAKE_BUILD_TYPE=Release -DUEVR_BUILD_COMPATIBILITY_TESTS=ON *> evidence/configure.log
          $code=$LASTEXITCODE; Get-Content evidence/configure.log | Select-Object -Last 60
          if ($code -ne 0) { throw "Original Joey configuration failed ($code)" }
      - name: Build original backend and auxiliary DLLs
        shell: pwsh
        run: |
          cmake --build backend/build --config Release --target uevr vr-plugin-nullifier LuaVR --parallel 2 *> evidence/backend-build.log
          $code=$LASTEXITCODE; Get-Content evidence/backend-build.log | Select-Object -Last 100
          if ($code -ne 0) { throw "Original latest Joey backend failed to compile ($code)" }
      - name: Build every test target used by the official matching build
        shell: pwsh
        run: |
          cmake --build backend/build --config Release --parallel 2 --target compatibility-policy-tests steam-frame-input-tests stock-frame-migration-tests gamepad-recovery-tests kananlib-decode-window-tests diagnostic-safety-tests prospi-camera-trace-tests prospi-camera-framing-tests prospi-celebration-framing-tests prospi-roof-visibility-tests hifi-hook-memory-tests nascar-hook-compatibility-tests input-hook-installation-tests mono-d3d11-tests mono-d3d12-tests ui-alpha-tests ui-alpha-lifecycle-tests ui-composition-tests lua-fname-binding-tests lua-context-dispatch-tests lua-controller-input-tests stalker2-native-policy-tests stalker2-native-d3d12-tests *> evidence/test-build.log
          $code=$LASTEXITCODE; Get-Content evidence/test-build.log | Select-Object -Last 100
          if ($code -ne 0) { throw "Original compatibility tests failed to compile ($code)" }
      - name: Run the complete original compatibility suite
        shell: pwsh
        run: |
          ctest --test-dir backend/build -C Release --output-on-failure --no-tests=error *> evidence/compatibility-tests.log
          $code=$LASTEXITCODE; Get-Content evidence/compatibility-tests.log
          if ($code -ne 0) { throw "Original compatibility tests failed ($code)" }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Test and build matching original frontend
        shell: pwsh
        run: |
          dotnet run --project frontend/tests/RenderingModes --configuration Release *> evidence/frontend-tests.log
          $code=$LASTEXITCODE; Get-Content evidence/frontend-tests.log
