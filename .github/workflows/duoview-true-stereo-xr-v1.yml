          Copy-Item backend/build/bin/uevr/*.dll package/
          Copy-Item backend/build/bin/vr-plugin-nullifier/UEVRPluginNullifier.dll package/
          Copy-Item backend/build/bin/LuaVR/LuaVR.dll package/
          Copy-Item workspace/duoview/clean_restart/baseline.lock.json package/
          Copy-Item evidence/exact-baseline-source.json package/
          Copy-Item evidence/duoview-stage1-edits.json package/
          Copy-Item evidence/duoview-stage1-source-hashes.json package/
          Copy-Item evidence/duoview-stage234-hashes.json package/
          Copy-Item workspace/ci48/hashes.json package/ci48-production-hashes.json
          @'
          DuoView TRUE STEREO XR V1 — EXPERIMENTAL HEADSET BUILD (REVIEW FIXES)
          Build branch: experiment/ci33-surface-stereo-20261028.
          Stable Build165/V3 and published stable releases are NOT modified.
          CI32 fixes completed depth copies being overwritten BEFORE their
          Present consumer, with old-bug reproduction and corrected WARP tests.
          It retains CI31 viewport/copy audit, mode 3 RIGHT-fovea-only A/B,
          and a fail-closed producer contract. Actual producer roles/frames
          remain UNVERIFIED; the contract has no UE depth-pass authentication
          hook yet. NEW: modes 4/5 use camera-relative full-matrix source-depth
          surface reconstruction LIVE, with a hardware target-eye depth buffer.
          The older standalone compute hybrid is still not dispatched.
          This ZIP contains the experimental first real two-eye output, not the old mono-only depth bridge.

          REQUIRED PSVR2 / STALKER 2 SETUP
          1. Extract into a SEPARATE test directory. Keep working V3 installation available.
          2. Select DuoView ID6 with V3 LEFT-fovea / RIGHT-periphery Split-Eye ON.
          3. Enable R5 DSV/RDG capture; leave and RE-ENTER ID6 to attach the live capture observer.
          4. Set View depth = 0 for clean tests. Stereo has priority over preview.
          5. TRUE STEREO 0 = previous V3 mono A/B; 1 = legacy reconstructed stereo;
             2 = legacy stereo + BLUE tint over ENTIRE RIGHT XR eye;
             3 = diagnostic RIGHT fovea synthesis only: identical real RIGHT
             periphery in BOTH XR eyes. Mode 3 is NOT full-matrix hybrid.
             4 = NEW source-depth RIGHT fovea (start here); unchanged RIGHT
                 periphery in both eyes isolates foveal reconstruction.
             5 = NEW source-depth surfaces in RIGHT fovea AND LEFT periphery.
             6 = NEW geometry coverage: green fovea = reconstructed; red =
                 actual RIGHT fallback; cyan peripheral = projected; magenta
                 peripheral = unavailable LEFT-only surface. Return to 4/5.
          6. Start in mode 0 and use CAPTURE NOW. The request stays pending until
             eligible submitted depths exist. Then verify mode 2 in the headset.
             BLUE tint must cover only the RIGHT eye, including its corners.
             Compare 0 and 1 on near edges, ~2m objects, scenery and head rotation.
          7. Selector 0 jointly matches both depth viewports to the frozen source
             geometries at a coherent render scale (including DLSS). This remains
             a heuristic, NOT proof of matching camera, frame or pass. Manual
             1..N ordinals override Auto; stale or duplicate choices are rejected.
             Ordinals can change after level load. Compare View depth 1/2/3 to
             actual color views, then return View depth to 0 for a capture.
          8. CAPTURE NOW records two source colors, submitted depth candidates,
             the final double-wide XR image, plus metadata under
             %TEMP%\UEVR_DuoViewCaptures. Preserve raw files and manifest.

          9. Read Actual XR output separately from the requested stereo mode.
             Missing/invalid depth now waits in V3 mono and retries automatically;
             it does not quarantine the two-view renderer. A recorded/submitted
             stereo counter is not incremented by this mono fallback.

          IMPLEMENTATION LIMITS — PLEASE READ
          Modes 4/5 rasterize continuous source-depth surfaces into the actual
          target camera. The hardware depth buffer resolves nearest surfaces.
          Source color remains at native resolution via projective sampling;
          the existing foveal sharpening applies to both foveae. Discontinuous
          source-depth triangles are discarded. Coarse actual target depth
          vetoes certain occluders, rather than defining all foveal geometry.
          Real RIGHT color fills unavailable regions. No additional Unreal
          scene render is introduced. Surfaces visible only to LEFT in the
          outer periphery cannot be recovered exactly from RIGHT RGBD alone.
          Mode 0 retains the previous composition, and allocates no surface
          maps. First new-mode activation/layout change allocates exact-sized
          maps once per retired XR slot and may cause an initial hitch.
          Modes 4/5/6 immediately select fresh retained current-interval GPU
          copies; the legacy pointer-based 3-epoch gate is bypassed. This
          removes that gate's extra stereo/mono toggles but does NOT certify
          scene-frame provenance. Missing current pairs still fall back.
          Manual captures include reconstruction color/alpha maps and numeric
          coverage in manifest.json; keep the whole capture folder intact.

          LEGACY modes 1/2/3:
          UE0 physically renders high-res cropped LEFT fovea; UE1 physically
          renders low-res full-FOV RIGHT periphery. TRUE STEREO mode uses one
          per-eye double-wide pixel shader: LEFT fovea is native; RIGHT fovea
          gathers LEFT color using RIGHT depth and conservative LEFT depth check,
          and uses actual RIGHT low-res color on rejected/disoccluded pixels.
          LEFT periphery uses a bounded 2-iteration inverse reprojection of
          RIGHT periphery from RIGHT depth. Full two-depth V2 backward gather and
          forward z/owner hybrid are compiled PROTOTYPES, not the live pipeline.
          This revision maps captured DSV active viewports and depth ranges,
          uses independent LEFT/RIGHT depth projection coefficients, rejects
          invalid resource shapes before recording, and tests analytic planes
          at 1/2/10 meters (UE centimeter units) plus padded viewports on
          production D3D12 WARP. A separate actual GPU capture test covers the
          observed DLSS-scaled small periphery, reused DSV write versions,
          read-only barrier storms and interval retirement after consumers.
          Neither captured depth eye/frame/stage identity nor exact game
          matrices have been proved. Do not interpret these tests as fixing
          the remaining provenance, jitter, or full-matrix geometry blockers.
          Counters distinguish recorded commands from submitted XR copies.
          Submitted means checked queue enqueue + XR image release, not
          GPU completion, xrEndFrame success, or physical headset visibility.
          Source-depth/pass attribution, occlusions at characters, Lumen shading,
          frame correspondence, temporal stability and headset optical comfort
          are NOT established by CI alone. A successful WARP test is NOT proof
          of high-quality stereo in STALKER 2.
          Keep Mono Eye Alignment OFF when validating physical stereo. Do not
          install this build over the verified user-tested V3 or stable DuoView.
          If stereo is wrong or uncomfortable, switch to mode 0 and preserve
          diagnostic capture + UEVR log before switching builds.

          Pinned original Joey backend: 5ac7edc207866569334175e4ed8a7517971547f6
          Pinned restricted SDK: 3cffbc82429b6165ceec2714f0f0d9ae48f55596
          Pinned frontend: 60be4b0f9a646109fd9fdf448bacd41477234091
