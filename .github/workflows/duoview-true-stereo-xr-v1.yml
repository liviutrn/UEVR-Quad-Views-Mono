            depth_pass_jitter_authenticated=$false;
            provenance_contract_tested=$true; producer_authenticated=$false;
            hybrid_live_dispatch=$false;
            ci49_ngx_sr_input_opt_in=$true; ngx_user_headset_verified=$false;
