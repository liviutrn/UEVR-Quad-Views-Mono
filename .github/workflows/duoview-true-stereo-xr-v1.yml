          if ((Get-Content package/READ_FIRST.txt -Raw) -notmatch 'TRUE STEREO XR V1') { throw 'Missing or stale actual stereo headset instructions' }
          Get-ChildItem package -Recurse -File | Get-FileHash -Algorithm SHA256 | ConvertTo-Json | Set-Content evidence/package-sha256.json
          $zip="UEVR-DuoView-TrueStereo-XR-V1-${{ github.run_number }}.zip"
          Compress-Archive -Path package/* -DestinationPath $zip -Force
