          } | ConvertTo-Json | Set-Content package/BUILD_STATUS.json
          # Stage234 manifest predates the final R5/stereo overlays. Hash the
          # actual generated public sources and embedded bytecode as built.
          $finalPaths=@('src/mods/VR.cpp','src/mods/VR.hpp','src/mods/vr/D3D12Component.cpp','src/mods/vr/D3D12Component.hpp','src/mods/vr/DuoViewD3D12.hpp','src/mods/vr/DuoViewGeometry.hpp','src/mods/vr/DuoViewState.hpp','src/mods/vr/DuoViewShaderSource.hpp','src/mods/vr/DuoViewStereoCompositeRaster.hlsl','src/mods/vr/d3d12/StockDibrDepth.hpp','src/mods/vr/d3d12/DuoViewDiagnosticDump.hpp','src/mods/vr/d3d12/DIBRTransaction.hpp','src/hooks/D3D12Hook.cpp')
          $finalPaths+=@('src/mods/vr/SurfaceGeometry.hpp','src/mods/vr/DuoViewSurfaceD3D12.hpp','src/mods/vr/DuoViewSurfaceReproject.hlsl','src/mods/vr/d3d12/CaptureSlotPolicy.hpp')
          $finalPaths | ForEach-Object {
