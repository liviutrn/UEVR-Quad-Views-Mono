name: VectorXR Mono Frame Generation (personal build)
run-name: VectorXR 0.20.0 + mono frame generation (${{ github.run_number }})
on:
  push:
    branches:
      - 'claude/vectorxr-mono-**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vectorxr-mono-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace
          persist-credentials: false
      - name: Check out VectorXR 0.20.0 (DienerTech/vectorxr, MPL-2.0)
        uses: actions/checkout@v4
        with:
          repository: DienerTech/vectorxr
          ref: 87e575fb21cde8ad9ef87763c67471b7d0b7ee0a
          path: vectorxr
          persist-credentials: false
      - name: Check out VectorXR's pinned vcpkg registry
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: aae277acf4e7de287ddb5e208b5316614de6aad7
          path: vectorxr/.vcpkg
          persist-credentials: false
      - name: Install the OpenXR loader (as VectorXR's own CI)
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE "vectorxr/.vcpkg"
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "Failed to bootstrap the pinned vcpkg registry." }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:VCPKG_ROOT = $vcpkgRoot
          & "$vcpkgRoot\vcpkg.exe" install openxr-loader:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "Failed to install the pinned OpenXR loader dependency." }
      - name: Apply the mono frame generation patch
        shell: pwsh
        run: |
          $head = git -C vectorxr rev-parse HEAD
          if ($head -ne '87e575fb21cde8ad9ef87763c67471b7d0b7ee0a') { throw "Unexpected VectorXR commit $head" }
          python workspace/vectorxr_mono/apply_vectorxr_mono.py vectorxr
          if ($LASTEXITCODE -ne 0) { throw 'Mono patch anchors did not match VectorXR 0.20.0' }
          New-Item -ItemType Directory evidence -Force | Out-Null
          git -C vectorxr add -N layer/include/depthxr/mono_framegen.h layer/tests/mono_framegen_tests.cpp
          git -C vectorxr diff | Set-Content -Encoding utf8 evidence/vectorxr-mono.patch
          git -C vectorxr diff --stat
      - name: Build the layer (Release)
        shell: pwsh
        run: |
          try {
            ./vectorxr/scripts/Build-Layer.ps1 -Configuration Release -SkipTests *> evidence/build.log
          } finally {
            Get-Content evidence/build.log -ErrorAction SilentlyContinue | Select-Object -Last 120
          }
      - name: Run the mono frame generation test
        shell: pwsh
        run: |
          ctest --test-dir vectorxr/build -C Release -R vectorxr_mono_framegen_tests --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw 'Mono frame generation test failed' }
      - name: Package the personal DLL
        shell: pwsh
        run: |
          $out = "package"
          New-Item -ItemType Directory $out -Force | Out-Null
          $dll = "vectorxr/build/layer/Release/XR_APILAYER_DIENERTECH_VECTORXR.dll"
          if (-not (Test-Path $dll)) { throw "Layer DLL missing at $dll" }
          Copy-Item $dll $out/
          Copy-Item vectorxr/build/layer/Release/XR_APILAYER_DIENERTECH_VECTORXR.json $out/
          Copy-Item vectorxr/LICENSE $out/LICENSE-MPL-2.0.txt
          Copy-Item vectorxr/THIRD-PARTY-NOTICES.txt $out/
          Copy-Item evidence/vectorxr-mono.patch $out/
          New-Item -ItemType Directory $out/source -Force | Out-Null
          Copy-Item workspace/vectorxr_mono/* $out/source/
          @'
          VECTORXR 0.20.0 + MONO FRAME GENERATION - PERSONAL TEST BUILD (not an official VectorXR release)
          Built from DienerTech/vectorxr 87e575f (tag v0.20.0, MPL-2.0) + the patch in vectorxr-mono.patch / source/.
          Unsigned. Personal use only. HEADSET UNVERIFIED.

          WHAT IT DOES
          When both eyes of the game show the SAME image (DuoView v208 with "Same image for both eyes" ON),
          frame generation runs once instead of once per eye: about half of VectorXR's video memory and GPU time.
          It starts by itself after ~45 frames and stops at once if the eyes ever differ (normal stereo still works).
          Each eye keeps its own field of view, so UEVR's Mono Eye Alignment (-1.5) is kept on every frame.
          Log lines in VectorXR's log: "Mono Frame Generation started / stopped / ... frames generated from one view".
          To switch it off without uninstalling: set the Windows environment variable VECTORXR_MONO_FRAMEGEN=0.

          INSTALL (keep a backup)
          1. Close the game and the VectorXR app.
          2. Find VectorXR's XR_APILAYER_DIENERTECH_VECTORXR.dll (VectorXR install folder, "vectorxr-layer" subfolder;
             or search the disk for that name).
          3. Rename the original to XR_APILAYER_DIENERTECH_VECTORXR.dll.bak, then copy this DLL there
             (Windows may ask for administrator permission). Do not replace the .json file.
          4. Turn off VectorXR auto-update, or re-copy this DLL after an update.
          UNDO: delete the new DLL and rename the .bak back.

          This requires your installed VectorXR app to be version 0.20.0.
          '@ | Set-Content $out/READ_FIRST.txt
          Get-ChildItem $out -Recurse -File | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content evidence/package-sha256.txt
          $zip = "VectorXR-0.20.0-Mono-FrameGen-${{ github.run_number }}.zip"
          Compress-Archive -Path $out/* -DestinationPath $zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: VectorXR-0.20.0-Mono-FrameGen-${{ github.run_number }}
          path: VectorXR-0.20.0-Mono-FrameGen-*.zip
          if-no-files-found: error
          retention-days: 90
      - name: Run VectorXR's full layer test suite (regression check)
        shell: pwsh
        run: |
          ctest --test-dir vectorxr/build -C Release --output-on-failure *> evidence/ctest.log
          $code = $LASTEXITCODE; Get-Content evidence/ctest.log | Select-Object -Last 120
          if ($code -ne 0) { throw "VectorXR test suite reported failures (see evidence/ctest.log)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VectorXR-Mono-Evidence-${{ github.run_number }}
          path: evidence/
          if-no-files-found: warn
