  portable-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: liviutrn/UEVR-Quad-Views-Mono
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run production-header recovery and ownership tests with ASan and UBSan
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          set -euo pipefail
          mkdir -p sanitizer-evidence
          for test in RetirementScopeTests HookTraceGateTests NativeRenderTraceTests NativeRoleFrameTests EngineRegistrationDiagnosticsTests RecoveryContinuityTests NativeDeliveryTests FamilyRoutingTests ContentProvenancePropertyTests ResizeGateTests DepthWarpSceneTests PoseSlotTests DepthIdentityTests TriViewThreePhysicalTests TriViewAdmissionTests ResourceReuseTests TriViewReusedDeliveryTests TriViewLocatedPoseTests TriViewGammaTablesTests TriViewEpochGateTests HeadMovementScalingTests FocusLiftMathTests FocusLiftSettingsTests SeamSettingsTests QuadViewDepthContinuityTests ColorSourceRectTests; do
            echo "[B18 sanitizer] $test"
            g++ -std=c++20 -O1 -g -pthread -UNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer "quadview/$test.cpp" -o "sanitizer-evidence/$test"
            "sanitizer-evidence/$test" > "sanitizer-evidence/$test.log" 2>&1
            cat "sanitizer-evidence/$test.log"
          done
          python3 quadview/NativeRoleFrameMutationTest.py
          python3 quadview/RecoveryMutationTest.py sanitizer-evidence/RecoveryContinuityTests
          python3 -m unittest discover -s quadview -p test_quadview_log_regression.py -v
          python3 -m unittest discover -s quadview -p test_quadview_hook_trace_summary.py -v
          # Original Build182 manifest is superseded by pinned complete v208d tree.
          test "$(git rev-parse HEAD:duoview)" = "3d5593a82ac13532989420b2e356b17602b1098b"
      - name: Validate M1 camera geometry and pull warp with ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I quadview quadview/duoview_port/DuoViewStereoGeometryTests.cpp -o sanitizer-evidence/DuoViewStereoGeometryTests
          sanitizer-evidence/DuoViewStereoGeometryTests | tee sanitizer-evidence/DuoViewStereoGeometryTests.log
      - name: Validate Mono B40 grouped temporal math with ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -g -UNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer quadview/duoview_port/B40MonoTemporalTests.cpp -o sanitizer-evidence/B40MonoTemporalTests
          sanitizer-evidence/B40MonoTemporalTests > sanitizer-evidence/B40MonoTemporalTests.log 2>&1
          cat sanitizer-evidence/B40MonoTemporalTests.log
      - uses: actions/upload-artifact@v4
        if: always()
