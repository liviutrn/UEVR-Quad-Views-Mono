name: TriView B43 + DuoView Mono M3b + World trace #21
# Exact per-role frame binding; original backend/SDK/frontend pins.
# Original reviewed rollback artifact prefix: UEVR-DuoView-M24- (B31 legacy contract); build output is M25a.
run-name: TriView B43 + DuoView Mono M3b + World trace #21 (${{ github.run_number }})
on:
  push:
    branches: ['claude/triview-**', 'experiment/triview-**', 'experiment/duoview-b40-mono-**', 'experiment/duoview-m1-**', 'experiment/duoview-m21-**', 'experiment/duoview-m22-**', 'experiment/duoview-m23-**', 'experiment/duoview-m24-**', 'experiment/duoview-m25a-**', 'experiment/duoview-m3a-**', 'experiment/duoview-m3b-**']
    paths: ['.github/workflows/triview-b1.yml', 'quadview/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: triview-b1-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  quadview-stereo-output:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: liviutrn/UEVR-Quad-Views-Mono
          ref: ${{ github.sha }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false
      - name: Pin complete DuoView v208d source; preserve TriView B43 ancestry
        shell: pwsh
        run: |
          $expected='3d5593a82ac13532989420b2e356b17602b1098b'
          $actual=(git -C workspace rev-parse 'HEAD:duoview').Trim()
          if ($actual -ne $expected) { throw "DuoView v208d tree mismatch: $actual (expected $expected)" }
          git -C workspace merge-base --is-ancestor 1f75a2dd28a54a2f5747d88a80a1317e41a05d43 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Mode7 B43 base is not an ancestor' }
      - uses: actions/checkout@v4
        with:
          repository: joeyhodge/UEVR
          ref: 5ac7edc207866569334175e4ed8a7517971547f6
          fetch-depth: 1
          path: backend
          persist-credentials: false
      - name: Require the SDK source credential
        shell: pwsh
        env:
          SDK_SOURCE_TOKEN: ${{ secrets.UEVR_SOURCE_TOKEN || secrets.PAT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SDK_SOURCE_TOKEN)) {
            throw 'Add the repository Actions secret UEVR_SOURCE_TOKEN using a token from your Epic-authorized GitHub account; the default repository token cannot access this SDK.'
          }
          'Configured SDK source credential detected; access will be checked against the exact original repository.'
      - name: Check out the original restricted SDK at the exact gitlink
        uses: actions/checkout@v4
        with:
          repository: joeyhodge/UESDK
          ref: 3cffbc82429b6165ceec2714f0f0d9ae48f55596
          token: ${{ secrets.UEVR_SOURCE_TOKEN || secrets.PAT_TOKEN }}
          path: backend/dependencies/submodules/UESDK
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: joeyhodge/uevr-frontend
          ref: 60be4b0f9a646109fd9fdf448bacd41477234091
          path: frontend
          persist-credentials: false
      - name: Verify the unchanged exact source and public dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory evidence -Force | Out-Null
          git -C backend submodule update --init --depth 1 -- dependencies/submodules/glm dependencies/submodules/imgui dependencies/submodules/spdlog
          if ($LASTEXITCODE -ne 0) { throw 'Pinned public submodule checkout failed' }
          python workspace/duoview/clean_restart/verify_exact_baseline.py workspace/duoview/clean_restart/baseline.lock.json backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Exact source identity or completeness verification failed' }
      - name: Apply exact-anchor Stage 1 fallback patch
        shell: pwsh
        run: |
          python workspace/duoview/joey_stage1/apply_stage1.py backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Failed to apply guarded DuoView Stage 1 edits' }
          python workspace/duoview/joey_stage1/verify_stage1.py backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected source changes in DuoView Stage 1' }
      - name: Apply Native Stereo Fix backed DuoView source changes
        shell: pwsh
        run: |
          python workspace/duoview/joey_stage1/apply_stage234.py backend frontend workspace/duoview
          if ($LASTEXITCODE -ne 0) { throw 'Stage 2-4 source anchors did not match original Joey' }
      - name: Port complete v208d DuoView Mono source into ID6 before TriView overlays
        shell: pwsh
        run: |
          # v208d order, using matched scripts from the pinned source tree.
          $scripts = @(
            'apply_foreground_mpc_minimal',
            'apply_mono_hud_convergence',
            'apply_mono_alignment_build48',
            'apply_runtime_eye_alignment_persistence_build49',
            'apply_xyz_head_scaling',
            'apply_manual_fov_global_lookup_v165',
            'apply_v205_manual_fov_runtime_hotkeys',
            'apply_v207_auto_fov_after_load',
            'apply_v208_shared_eye_vram',
            'apply_v208b_sharpen_max_change',
            'apply_v208d_vram_options'
          )
          foreach ($s in $scripts) {
            python workspace/duoview/joey_stage1/$s.py backend
            if ($LASTEXITCODE -ne 0) { throw "v208d DuoView script $s failed its anchors" }
            if ($s -eq 'apply_runtime_eye_alignment_persistence_build49') {
              python workspace/duoview/joey_stage1/test_runtime_eye_alignment_persistence_build49.py backend
              if ($LASTEXITCODE -ne 0) { throw 'v208d alignment persistence test failed' }
            }
          }
          python workspace/duoview/joey_stage1/test_xyz_head_scaling.py backend
          if ($LASTEXITCODE -ne 0) { throw 'v208d XYZ scaling test failed' }
          # v208d verifier expects HUD scripts to edit OverlayComponent.
          # Run after all v208d scripts, matching its original workflow.
          python workspace/duoview/joey_stage1/verify_stage234.py backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Complete v208d source-integrity contracts failed' }
          git -C backend diff --check
          if ($LASTEXITCODE -ne 0) { throw 'v208d generated source whitespace errors' }
      - name: Apply isolated stereo QuadView backend overlay
        shell: pwsh
        run: |
          python workspace/quadview/apply_quadviews.py backend frontend workspace/quadview
          if ($LASTEXITCODE -ne 0) { throw 'QuadView guarded source overlay failed' }
          python workspace/quadview/apply_quadview_consumer.py backend
          if ($LASTEXITCODE -ne 0) { throw 'QuadView consumer source overlay failed' }
          python workspace/quadview/apply_quadview_native_delivery.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Four-source Native Stereo Fix delivery overlay failed' }
          python workspace/quadview/apply_quadview_native_retirement.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Fenced native target retirement overlay failed' }
          python workspace/quadview/apply_quadview_recovery.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Engine-only bootstrap/shared-tail recovery overlay failed' }
          python workspace/quadview/apply_quadview_role_frames.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Exact singleton frame binding overlay failed' }
          python workspace/quadview/apply_quadview_hook_trace.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Hook trace overlay failed' }
          python workspace/quadview/apply_quadview_hook_output_trace.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Hook output trace overlay failed' }
          python workspace/quadview/apply_quadview_present_setup.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Presentation retirement scope patch failed' }
          python workspace/quadview/apply_quadview_target_lifetime.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Engine-owned native target lifetime patch failed' }
          python workspace/quadview/apply_quadview_triview.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Tri-view overlay failed its exact anchors' }
          python workspace/quadview/apply_triview_parity.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Tri-view B5 parity patch failed its exact anchors' }
          python workspace/quadview/apply_triview_compact.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Tri-view B6 compact source patch failed its exact anchors' }
          python workspace/quadview/apply_triview_depth.py backend workspace/quadview
          if ($LASTEXITCODE -ne 0) { throw 'Tri-view B7 periphery depth patch failed its exact anchors' }
          python workspace/quadview/apply_triview_eye_sharpen.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Tri-view B8 per-eye sharpening patch failed its exact anchors' }
          python workspace/quadview/apply_triview_stability.py backend workspace/quadview
          if ($LASTEXITCODE -ne 0) { throw 'B9 stable status panel overlay failed its exact anchors' }
          python workspace/quadview/apply_triview_bootstrap.py backend
