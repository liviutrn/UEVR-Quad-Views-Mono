name: Publish v182 release notes

on:
  push:
    branches: [main]
    paths:
      - 'RELEASE_NOTES_v182.md'
      - '.github/workflows/publish-v182-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-v182-notes:
    if: github.repository == 'liviutrn/UEVR-Quad-Views-Mono'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release notes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update existing GitHub release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v182 --repo "${GITHUB_REPOSITORY}" >/dev/null
          gh release edit v182 --repo "${GITHUB_REPOSITORY}" --notes-file RELEASE_NOTES_v182.md
