name: DuoView Game MPC Public Source Preflight
on:
  push:
    branches:
      - experiment/duoview-game-foreground-mpc-20261021
  pull_request:
    branches:
      - build-182
permissions:
  contents: read
jobs:
  preflight:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: joeyhodge/UEVR
          ref: 5ac7edc207866569334175e4ed8a7517971547f6
          path: backend
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: joeyhodge/uevr-frontend
          ref: 60be4b0f9a646109fd9fdf448bacd41477234091
          path: frontend
          persist-credentials: false
      - name: Syntax check source patch scripts
        run: |
          python -m py_compile workspace/duoview/joey_stage1/apply_stage1.py
          python -m py_compile workspace/duoview/joey_stage1/apply_stage234.py
          python -m py_compile workspace/duoview/joey_stage1/apply_convergence.py
          python -m py_compile workspace/duoview/joey_stage1/apply_foreground.py
          python -m py_compile workspace/duoview/joey_stage1/verify_stage234.py
      - name: Apply exact source edits without private SDK
        run: |
          mkdir -p evidence
          python workspace/duoview/joey_stage1/apply_stage1.py backend frontend evidence
          python workspace/duoview/joey_stage1/apply_stage234.py backend frontend workspace/duoview
      - name: Inspect applied C++ safety and target contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          v = Path('backend/src/mods/VR.cpp').read_text(encoding='utf-8')
          h = Path('backend/src/mods/VR.hpp').read_text(encoding='utf-8')
          f = Path('backend/src/mods/vr/FFakeStereoRenderingHook.cpp').read_text(encoding='utf-8')
          x = Path('backend/src/mods/vr/OverlayComponent.cpp').read_text(encoding='utf-8')
          for text in ('MPC_FOV', 'IsFOVEnabled', 'DepthScale',
                       'GetScalarParameterValue', 'SetScalarParameterValue',
                       'update_duoview_game_foreground(engine)',
                       'baseline.world_id', 'get_live_objects_by_class_name'):
              assert text in v, text
          assert 'DuoViewStalker2ForegroundMPC' in h
          assert 'foreground::find_slot' not in f
          assert 'note_duoview_foreground(fovea,adjusted)' not in f
          assert 'half_shift' in x
          print('Applied Joey source patch, game-MPC flow, no view-memory scanner and UI convergence checks passed')
          PY
